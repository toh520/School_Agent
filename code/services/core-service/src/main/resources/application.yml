spring:
  application:
    name: school-agent-core-service
  datasource:
    url: ${SCHOOL_AGENT_DB_URL}
    username: ${SCHOOL_AGENT_DB_USERNAME}
    password: ${SCHOOL_AGENT_DB_PASSWORD}
    hikari:
      connection-timeout: 3000
      validation-timeout: 2000
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Shanghai

school-agent:
  agent-base-url: ${SCHOOL_AGENT_AGENT_URL}
  web-origin: ${SCHOOL_AGENT_WEB_ORIGIN}
  auth:
    jwt-secret: ${SCHOOL_AGENT_AUTH_JWT_SECRET}
    access-token-minutes: ${SCHOOL_AGENT_AUTH_ACCESS_MINUTES:15}
    refresh-token-days: ${SCHOOL_AGENT_AUTH_REFRESH_DAYS:7}

server:
  address: 127.0.0.1
  port: ${SCHOOL_AGENT_CORE_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.schoolagent: INFO
