name: 缺陷报告
description: 记录可复现、可验证的系统缺陷
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: requirement
    attributes:
      label: 关联需求或验收场景
  - type: textarea
    id: environment
    attributes:
      label: 环境与版本
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与证据
    validations:
      required: true
